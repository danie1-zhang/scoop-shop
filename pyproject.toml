[project]
name = "scoop-shop"
version = "0.1.0"
description = "A small FastAPI and React ice cream ordering application"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "email-validator>=2.3.0",
    "fastapi>=0.128.8,<1.0",
    "psycopg[binary]>=3.2.13,<4.0",
    "pwdlib[argon2]>=0.2.1,<1.0",
    "pydantic>=2.13.4,<3.0",
    "pyjwt>=2.13.0,<3.0",
    "python-dotenv>=1.2.1,<2.0",
    "sqlalchemy>=2.0.52,<3.0",
    "uvicorn[standard]>=0.39.0,<1.0",
]

[tool.uv]
package = false
