name: Backend tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET_KEY: ci-only-test-secret
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scoop_shop_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scoop_shop_test
      CORS_ORIGINS: http://localhost:5173

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoop_shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run backend tests
        run: uv run pytest
